name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [1.85.0, stable]

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy,rustfmt
      - name: Select Rust
        run: rustup override set "${{ matrix.toolchain }}"
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Doctests
        run: cargo test --locked --workspace --all-features --doc
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
