[workspace]
members = ["rfsm-macros"]
resolver = "3"

[package]
name = "rfsm"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Table-first finite state machines for Rust"
repository = "https://github.com/mudake-rs/rfsm"
include = [
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/examples/**/*.md",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[dependencies]
rfsm-macros = { version = "0.3.0", path = "rfsm-macros" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde", "rfsm-macros/serde"]

[dev-dependencies]
serde_json = "1"
